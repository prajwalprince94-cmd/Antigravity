name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-Level1.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v2.2.0"
          name: "Expense Tracker v2.2.0 (Appllama Mobile Design System & Skeletons)"
          body: |
            ### 📱 Expense Tracker v2.2.0 (Appllama Native Benchmark Edition)
            - **Appllama Design System Primitives:**
              - *Continuous Squircle Shape Scale:* Strict shape locking with `BadgeShape (8dp)`, `ChipShape (12dp)`, `InputShape (16dp)`, `ButtonShape (18dp)`, `CardShape (20dp)`, `LargeCardShape (24dp)`, and `SheetShape (28dp top)`.
              - *Tactile Haptic Press Feedback:* Physical press-in haptic ticks on keypad keys, bottom navigation tabs, budget scrubber sliders, and action buttons via `rememberAppHaptics()` and `bouncyClickable(hapticFeedback = true)`.
              - *Zero-Slop Composed Empty States:* Polished, expressive empty states via `EmptyStateView` with native iconography and immediate primary call-to-action buttons for Home, Transactions, and Budgets.
              - *Layout-Preserving Shimmer Skeletons:* Added `HomeScreenSkeleton`, `TransactionsScreenSkeleton`, and `BudgetsScreenSkeleton` matching layout geometry with zero layout shifts or jank.
              - *Tabular Numerals:* Enforced `tabular-nums` formatting across rupee tickers, transaction amounts, and budget progress dials to eliminate horizontal jitter.
            - **In-App Updater Multi-Hop Redirects & Storage:**
              - Multi-hop HTTP 302/307 redirect engine resolves Azure CDN releases seamlessly.
              - SELinux compliant external download storage enables one-tap installation on modern Android versions.

            #### 📥 Download & Install:
            Download **`ExpenseTracker-v2.2.0-appllama-masterpiece.apk`** below under Assets.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk
            app/build/outputs/apk/debug/ExpenseTracker-Level1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
