name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-Level1.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v2.3.0"
          name: "Expense Tracker v2.3.0 (CSV Data Export & Share Sheet)"
          body: |
            ### 📊 Expense Tracker v2.3.0 (CSV Statement Export & Share Sheet)
            - **RFC 4180 Compliant CSV Export Engine:**
              - Fast, memory-efficient streaming CSV generator escaping quotes, commas, and newlines according to standard specifications.
              - Exports full transaction attributes: `Transaction ID`, `Title`, `Category`, `Type` (Expense/Income/Transfer), `Account`, `Amount (INR)`, `Date & Time`, and `Remark / Note`.
            - **Native Android Share Sheet Integration:**
              - Generates timestamped `.csv` file in private cache storage (`context.cacheDir/exports/`) with secure FileProvider URI grants (`FLAG_GRANT_READ_URI_PERMISSION`).
              - Triggers native Android Chooser (`Intent.createChooser`) allowing direct sharing to WhatsApp, Google Drive, Gmail, Slack, Telegram, or any local file manager.
            - **Seamless Multi-Touchpoint Access:**
              - **Transactions Screen Quick Export:** Quick-tap "Export" pill button right next to the screen header automatically exports active search & category filtered results.
              - **Settings Screen Offline Vault Export:** "Export Statement (CSV)" row in the Offline Database Vault section shares the complete database statement with transaction counts and error protection.
            - **Appllama Design System & Skeletons:**
              - Squircle scale, tactile haptic feedback, shimmering layout-matched skeletons, and zero-slop empty states.

            #### 📥 Download & Install:
            Download **`ExpenseTracker-v2.3.0-csv-export.apk`** below under Assets.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk
            app/build/outputs/apk/debug/ExpenseTracker-Level1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
