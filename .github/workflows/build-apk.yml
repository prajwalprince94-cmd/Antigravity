name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-Level1.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0-preview"
          name: "Expense Tracker Preview (Level 1)"
          body: |
            ### 📱 Expense Tracker Preview Build
            - **Level:** Level 1 (Theme + 4-Screen Floating Navigation Skeleton)
            - **Design:** Pixel-inspired Material 3 Expressive
            - **Target:** Android 8.0 (API 26) through Android 15 (API 35)
            
            #### 📥 How to Install on your Phone:
            1. Download `ExpenseTracker-Level1.apk` below under Assets.
            2. Open the downloaded file on your Android phone.
            3. If prompted, allow "Install unknown apps" for your browser.
            4. Open **Expense Tracker** and test the 4-screen navigation!
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-Level1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
