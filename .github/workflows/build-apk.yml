name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.6.0-subscriptions.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.5.0-biometric-pin-lock.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.4.0-accounts-categories.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v2.6.0"
          name: "Expense Tracker v2.6.0 (Recurring Subscriptions & Scheduled Bills)"
          body: |
            ### 📅 Expense Tracker v2.6.0 (Recurring Subscriptions & Scheduled Bills Suite)
            - **Recurring Subscriptions & Scheduled Bills:**
              - Complete subscription manager for streaming services, utilities, internet bills, rent, and recurring commitments.
              - Flexible billing cycles: Monthly, Quarterly, and Yearly.
              - Real-time calculation of committed monthly recurring expenditure.
            - **Due-Date Tracking & Overdue Badges:**
              - Dynamic countdowns: `Due in X days`, `Due Today`, `Overdue by X days`.
              - Status filters: `All`, `Upcoming` (next 7 days), `Active`, and `Paused`.
            - **One-Tap Payment Logging:**
              - Instant "Mark Paid" button on both HomeScreen and SubscriptionsScreen.
              - Atomically logs an expense transaction into the linked wallet/bank account and automatically rolls forward the next due date without manual calculation.
            - **HomeScreen Upcoming Bills Carousel:**
              - Fluid horizontal carousel showing bills due soon with quick-pay actions.
            - **Biometric & PIN Security Suite (v2.5.0):**
              - Fingerprint/Face biometric unlock, 4-digit PIN fallback, auto-lock timeout, and Recents Privacy Shield.
            - **Stride & Appllama Benchmark UI/UX:**
              - OLED high-contrast dark mode, continuous squircle iconography, spring micro-interactions, and zero horizontal jitter.

            #### 📥 Download & Install:
            Download **`ExpenseTracker-v2.6.0-subscriptions.apk`** below under Assets.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-v2.6.0-subscriptions.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.5.0-biometric-pin-lock.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.4.0-accounts-categories.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
