name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v1.2-range-poppins.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-Level1.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.2-preview"
          name: "Expense Tracker Preview v1.2 (Range Redesign & Poppins Typography)"
          body: |
            ### 📱 Expense Tracker Preview Build v1.2
            - **Typography:** Genuine offline-bundled **Poppins Font** family (Regular, Medium, SemiBold, Bold, ExtraBold)
            - **Design & UI:** Complete redesign inspired by [NikhilKain/Range](https://github.com/NikhilKain/Range)
            - **Atmosphere:** Living **AuroraBackground** with ambient color blooms & starfield drifting at power-saving 10-15 fps
            - **Components:** **GlassCard** depth with hairline top borders in dark mode, **StatusPill**, and **SectionHeader**
            - **Interactive BudgetTape:** Tape-measure dial with tactile haptic ruler scrubbing in Budgets
            - **Motion & Navigation:** Range horizontal sliding + fade transitions across all screens and Stride bouncy clickables
            - **Target:** Android 8.0 (API 26) through Android 15 (API 35)
            
            #### 📥 Download & Install:
            Download **`ExpenseTracker-v1.2-range-poppins.apk`** below under Assets.
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-v1.2-range-poppins.apk
            app/build/outputs/apk/debug/ExpenseTracker-Level1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
