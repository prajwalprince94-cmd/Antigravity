name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.4.0-accounts-categories.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v2.4.0"
          name: "Expense Tracker v2.4.0 (Accounts & Custom Categories Management)"
          body: |
            ### 💳 Expense Tracker v2.4.0 (Accounts & Custom Categories Masterpiece)
            - **Multi-Account Vault & Live Balance Architecture:**
              - Complete management (Create, Edit, Delete) for multi-account financial containers (`UPI`, `BANK`, `CASH`, `CARD`, `SAVINGS`).
              - Real-time mathematically verified balance calculation combining opening balance with atomic credits and debits from recorded transactions.
              - Full SQLite ACID persistence with zero-data-loss database schema migration (`accounts` table).
            - **Custom Category Creator & Icon Registry:**
              - User-created custom category tags for both `Expense` and `Income`.
              - Centralized `IconRegistry` with 21+ curated finance, lifestyle, travel, and utility icons and 10 vibrant color swatches.
              - System default categories protection (default categories are locked to guarantee core budget tracking stability).
            - **Seamless App-Wide Integration:**
              - **Quick Add Transaction Sheet:** Category and account selector chips dynamically reflect user accounts and newly created tags.
              - **Home Dashboard Carousel:** Real-time account balances, color badges, and one-tap "Manage" pill leading directly to Accounts & Categories.
              - **Settings Configuration:** Dedicated "Accounts & Tagging" section for direct access and management.
            - **Stride & Appllama Design Polish:**
              - Squircle continuous shape scale, responsive segmented pill tab switcher, fluid bottom sheets, tactile haptic feedback, and pure OLED dark mode contrast.

            #### 📥 Download & Install:
            Download **`ExpenseTracker-v2.4.0-accounts-categories.apk`** below under Assets.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-v2.4.0-accounts-categories.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
