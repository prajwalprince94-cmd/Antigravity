name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-Level1.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v2.0-masterpiece"
          name: "Expense Tracker v2.0 (Stride Masterpiece UI/UX, Vyxel Boot, Offline SQLite Vault)"
          body: |
            ### 📱 Expense Tracker v2.0 Masterpiece Release
            - **UI/UX & Navigation (Stride as Core Focus):** Floating pill dock with active tab horizontal spring expansion, icon overshoot pop animation, AMOLED dark surface ladder, and bouncy physical squash tap feedback.
            - **Branded Startup Experience (Vyxel):** Branded `BootSequence` on cold start with pulsating brand mark, progress shimmer, and smooth 400ms crossfade into main app.
            - **List Dissolution (Vyxel):** `Modifier.fadingEdges(top, bottom)` on all LazyColumns so content dissolves smoothly above navigation bars without harsh cutoffs.
            - **Living Atmosphere & Scrubbing (Range):** Living `AuroraBackground` ambient color blooms and `BudgetTape` interactive tape-measure ruler dial with tactile feedback.
            - **100% Working Offline-First SQLite Persistence:** Full ACID database persistence for transactions, category budgets, and preferences surviving device reboots.
            - **Fixed Touch & Clicks:** Completely eliminated button click collisions for instant, reliable response on every tap.
            - **Typography:** Genuine offline-bundled Poppins font family across all screens.
            
            #### 📥 Download & Install:
            Download **`ExpenseTracker-v2.0-stride-masterpiece.apk`** below under Assets.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-Level1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
