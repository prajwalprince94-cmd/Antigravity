name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v3.5.0-supabase-sync.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v3.4.0-multi-currency.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v3.3.0-pdf-tax-statement.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v3.2.0-budget-forecast.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v3.1.0-glance-widgets.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v3.0.0-sms-tracker.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.9.0-receipt-ocr.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.8.0-split-bills.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.7.0-analytics-dashboard.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.6.0-subscriptions.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.5.0-biometric-pin-lock.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.4.0-accounts-categories.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v3.5.0"
          name: "Expense Tracker v3.5.0 (Supabase Real-Time Cloud Sync & Offline Conflict Engine)"
          body: |
            ### 📱 Expense Tracker v3.5.0 (Supabase Real-Time Cloud Sync & Offline Conflict Engine)
            - **Supabase Cloud Synchronization Engine (`SupabaseSyncEngine`):**
              - Native Android HTTP PostgREST integration communicating directly with Supabase tables (`/rest/v1/transactions`).
              - **100% Offline-First Core:** Operates with zero network latency on device; changes are queued and synced automatically when connected.
              - **Developer Demo Sandbox Mode:** Pre-loaded simulation engine allowing instant testing of upload, download, and merge workflows without requiring an active Supabase project.
              - **Enterprise Conflict Resolution Suite (`ConflictResolutionStrategy`):**
                - *Latest Timestamp (LWW)*: Automatically keeps the most recent edit across devices.
                - *Cloud Server Wins*: Resolves discrepancies by prioritizing cloud records.
                - *Local Device Wins*: Resolves discrepancies by prioritizing device state.
              - **Connection Health Checker:** Live ping test verifying Project URL and Anon API Key validity.
              - **Live Activity & Audit Log:** Real-time log tracking records pushed, pulled, conflicts handled, and timestamp history.
            - **Interactive Cloud Sync Sheet (`SupabaseSyncSheet`):**
              - Hero sync status card with online/offline/syncing status pills.
              - 1-tap "Sync Now" action with animated progress indicator.
              - Supabase URL & Anon API Key credential configuration fields.
            - **Multi-Currency Support & Live FX Conversion Engine (v3.4.0)**
            - **Advanced PDF Tax Statement & Financial Report Generator (v3.3.0)**
            - **Smart Budget Forecasting & AI Insights (v3.2.0)**
            - **Interactive Home Screen Widgets with Jetpack Glance (v3.1.0)**
            - **Automated Bank SMS Expense Parser & UPI Tracker (v3.0.0)**
            - **Smart Receipt OCR & Document Scanner (v2.9.0)**
            - **Split Expense & Group Bill Splitting Suite (v2.8.0)**
            - **Financial Health & Analytics Dashboard (v2.7.0)**
            - **Recurring Subscriptions & Scheduled Bills (v2.6.0)**
            - **Biometric & PIN Security Suite (v2.5.0)**

            #### 📥 Download & Install:
            Download **`ExpenseTracker-v3.5.0-supabase-sync.apk`** below under Assets.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-v3.5.0-supabase-sync.apk
            app/build/outputs/apk/debug/ExpenseTracker-v3.4.0-multi-currency.apk
            app/build/outputs/apk/debug/ExpenseTracker-v3.3.0-pdf-tax-statement.apk
            app/build/outputs/apk/debug/ExpenseTracker-v3.2.0-budget-forecast.apk
            app/build/outputs/apk/debug/ExpenseTracker-v3.1.0-glance-widgets.apk
            app/build/outputs/apk/debug/ExpenseTracker-v3.0.0-sms-tracker.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.9.0-receipt-ocr.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.8.0-split-bills.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.7.0-analytics-dashboard.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.6.0-subscriptions.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.5.0-biometric-pin-lock.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.4.0-accounts-categories.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
