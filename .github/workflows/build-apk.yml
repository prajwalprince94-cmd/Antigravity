name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.7.0-analytics-dashboard.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.6.0-subscriptions.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.5.0-biometric-pin-lock.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.4.0-accounts-categories.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v2.7.0"
          name: "Expense Tracker v2.7.0 (Financial Health & Advanced Analytics Dashboard)"
          body: |
            ### 📊 Expense Tracker v2.7.0 (Financial Health & Advanced Analytics Dashboard)
            - **0-100 Gamified Financial Health Score:**
              - Evaluates savings rate (35 pts), budget adherence (25 pts), subscription commitments (20 pts), and cashflow stability (20 pts).
              - Dynamic tier badges (`Excellent`, `Good`, `Fair`, `Needs Attention`) with radial sweep arc gauge and animated counter.
            - **Month-Over-Month Comparison Trends:**
              - Comparative spending analysis between current month and prior month.
              - Day-by-day dual line tracking and variance percentage delta pills.
            - **Predictive Burn-Rate & Month-End Forecast:**
              - Real-time daily burn rate tracker (`₹X/day`).
              - End-of-month projected spending and estimated surplus/deficit vs income.
            - **Interactive Category Distribution Donut Chart:**
              - Native Canvas donut chart with touch-slice expansion and center data inspection.
              - Category percentage breakdown with color tags and transaction counts.
            - **Actionable AI-Style Insights Carousel:**
              - Tailored recommendations on high category concentration, subscription load, over-budget items, and savings wins.
            - **Recurring Subscriptions & Scheduled Bills (v2.6.0):**
              - Due-date tracking, overdue badges, and one-tap payment auto-logging.
            - **Biometric & PIN Security Suite (v2.5.0):**
              - Fingerprint/Face biometric unlock, 4-digit PIN fallback, and Recents Privacy Shield.

            #### 📥 Download & Install:
            Download **`ExpenseTracker-v2.7.0-analytics-dashboard.apk`** below under Assets.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-v2.7.0-analytics-dashboard.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.6.0-subscriptions.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.5.0-biometric-pin-lock.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.4.0-accounts-categories.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
