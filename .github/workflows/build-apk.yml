name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v1.1-stride-motion.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-Level1.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.1-preview"
          name: "Expense Tracker Preview v1.1 (Stride Motion & Interactivity)"
          body: |
            ### 📱 Expense Tracker Preview Build v1.1
            - **Enhancements:** Full UI/UX makeover inspired by `NikhilKain/stride`
            - **Motion & Physics:** Stride `bouncyClickable` squash-and-spring haptics on cards, buttons, keypad, & tabs
            - **Odometer Numbers:** `AnimatedRupeeTicker` rolling numerals for balances and currency entry
            - **Expressive Theming:** ColorBlendr saturation/hue treatments, 4 palettes (Emerald, Ocean, Crimson, Amethyst), and pure-black AMOLED surface ladder
            - **Full Interactivity:** Live theme toggles in Settings, interactive budget limit editor, real-time search and filters
            - **Target:** Android 8.0 (API 26) through Android 15 (API 35)
            
            #### 📥 Download & Install:
            Download **`ExpenseTracker-v1.1-stride-motion.apk`** below under Assets.
          draft: false
          prerelease: true
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-v1.1-stride-motion.apk
            app/build/outputs/apk/debug/ExpenseTracker-Level1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
