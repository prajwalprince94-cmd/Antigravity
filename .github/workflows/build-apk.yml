name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.5.0-biometric-pin-lock.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.4.0-accounts-categories.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v2.5.0"
          name: "Expense Tracker v2.5.0 (Biometric & 4-Digit PIN App Lock Suite)"
          body: |
            ### 🔐 Expense Tracker v2.5.0 (Biometric & PIN App Lock Suite)
            - **Biometric Security & System Authentication:**
              - Native `androidx.biometric` integration for hardware fingerprint and face unlock.
              - Auto-triggers system biometric prompt upon application launch or resuming from background.
            - **4-Digit Fallback PIN Engine:**
              - Salted SHA-256 cryptographic PIN verification.
              - 2-step setup and PIN modification bottom sheet with confirmation check.
              - Responsive custom 12-key tactile keypad (0-9, Biometric shortcut, Backspace).
              - Spring oscillation error shake animation + tactile haptic feedback on invalid attempts.
            - **Configurable Auto-Lock Delays:**
              - Flexible delay options: `Immediately`, `After 1 Minute`, or `After 5 Minutes` when backgrounded.
            - **Android Recents Privacy Shield:**
              - Toggles `WindowManager.LayoutParams.FLAG_SECURE` to block screenshots and hide preview cards from the Android Recent Apps switcher.
            - **Stride & Appllama Benchmark UI/UX:**
              - OLED high-contrast dark mode, squircle iconography, continuous springs, and zero horizontal scroll jitter.

            #### 📥 Download & Install:
            Download **`ExpenseTracker-v2.5.0-biometric-pin-lock.apk`** below under Assets.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-v2.5.0-biometric-pin-lock.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.4.0-accounts-categories.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
