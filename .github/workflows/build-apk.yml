name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.8.0-split-bills.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.7.0-analytics-dashboard.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.6.0-subscriptions.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.5.0-biometric-pin-lock.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.4.0-accounts-categories.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v2.8.0"
          name: "Expense Tracker v2.8.0 (Split Expense & Group Bill Splitting Suite)"
          body: |
            ### 👥 Expense Tracker v2.8.0 (Split Expense & Group Bill Splitting Suite)
            - **Split Groups & Multi-Member Management:**
              - Create and organize expense sharing groups for roommates, vacation trips, dining, and utilities.
              - Custom group accent colors, semantic icons, and member avatar badge stacks.
            - **Flexible Bill Splitting Modes:**
              - **Equally:** Automatic equal distribution with intelligent remainder paise allocation to the payer.
              - **Exact Amounts:** Specify exact rupee contributions per member with real-time balance validation.
              - **Percentages:** Allocate dynamic percentage shares with live 100% total checker.
            - **Greedy Debt Minimization Algorithm (`SplitDebtCalculator`):**
              - Automatically eliminates circular debt across group members, condensing complex multi-way balances into minimal direct transfers.
              - Clear breakdown of net balances: "You are owed ₹X" vs "You owe ₹Y".
            - **One-Tap Debt Settlement & Real-Account Sync:**
              - Record settlements directly with one tap from the debt matrix.
              - Bi-directional sync with real accounts: Automatically records an Income or Expense transaction in your chosen bank or wallet account!
            - **Financial Health & Analytics Dashboard (v2.7.0):**
              - 0-100 Financial Health score, month-over-month trends, daily burn rate, and interactive donut chart.
            - **Recurring Subscriptions & Scheduled Bills (v2.6.0):**
              - Due-date tracking, auto-log payments, and recurring bill reminders.
            - **Biometric & PIN Security Suite (v2.5.0):**
              - Fingerprint, Face biometric unlock, 4-digit PIN, and Recents Privacy Shield.

            #### 📥 Download & Install:
            Download **`ExpenseTracker-v2.8.0-split-bills.apk`** below under Assets.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-v2.8.0-split-bills.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.7.0-analytics-dashboard.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.6.0-subscriptions.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.5.0-biometric-pin-lock.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.4.0-accounts-categories.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.3.0-csv-export.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.2.0-appllama-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.1.0-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
