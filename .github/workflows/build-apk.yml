name: Build & Release Debug APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpenseTracker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-Level1.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v2.0-masterpiece"
          name: "Expense Tracker v2.0 (Stride Masterpiece UI/UX, High-Contrast Obsidian, Zero-Lag)"
          body: |
            ### 📱 Expense Tracker v2.0 Masterpiece Release (High-Contrast & Performance Edition)
            - **Performance & Zero-Lag (Buttery 60/120 FPS):**
              - *Draw-Phase Phase Deferral:* `AuroraBackground` ambient animation reads are deferred directly to `drawBehind`, completely eliminating the root-level recomposition loop.
              - *Non-Allocating List Dissolution:* `Modifier.fadingEdges` replaced GPU offscreen FBO texture churn with direct gradient overlay passes.
              - *Stutter-Free Lazy Scrolling:* Removed LaunchedEffect item animations and delays inside lazy column items for immediate, fluid scrolling.
              - *Streamlined Rupee Ticker:* Unified numeric odometer transitions into a single composite transition node.
            - **High-Contrast Surface Ladder (Stride & Zenith Inspiration):**
              - *Dark / AMOLED Mode:* Pure white text (`#F8FAFC`) on elevated obsidian (`#161B20`) cards over deep obsidian (`#0B0F12`) / AMOLED black (`#000000`).
              - *Light Mode:* Deep ink black text (`#0F172A`) on crisp white cards (`#FFFFFF`) over soft cool slate (`#F4F6F8`).
              - *Semantic Indicators:* Vivid Emerald (`#10B981` / `#34D399`) and Coral (`#EF4444` / `#F87171`) with adaptive high-contrast badges (no muddy clashing pastels).
            - **UI/UX & Navigation (Stride as Core Focus):** Floating pill dock with active tab horizontal spring expansion, icon overshoot pop animation, and bouncy physical squash tap feedback.
            - **Branded Startup Experience (Vyxel):** Branded `BootSequence` on cold start with pulsating brand mark, progress shimmer, and smooth 400ms crossfade into main app.
            - **100% Offline SQLite Persistence:** Full ACID database persistence for transactions, category budgets, and preferences surviving device reboots.
            - **Typography:** Genuine offline-bundled Poppins font family across all screens.
            
            #### 📥 Download & Install:
            Download **`ExpenseTracker-v2.0-stride-masterpiece.apk`** below under Assets.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/debug/ExpenseTracker-v2.0-stride-masterpiece.apk
            app/build/outputs/apk/debug/ExpenseTracker-high-contrast.apk
            app/build/outputs/apk/debug/ExpenseTracker-Level1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
